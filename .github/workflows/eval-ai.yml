# Satisfies: REQ-12-05, NFR-12-07
# AI eval gate — runs only when lib/ai/**, evals/**, or lib/ai/prompts/** change.
# Validates dataset shape/thresholds/catalog_snapshot_hash and runs cross-tenant probes
# (REQ-11-06, fail-closed: unverified probe = hard failure).
#
# NOTE: Model-quality scenario scoring (Specs 05/06/07/08) is not yet enforced here —
# app/api/evals/run is not implemented. Scenarios are reported as SKIPPED, not faked.
# When AI_GATEWAY_API_KEY is absent (fork PRs), this workflow skips cleanly — by design (§8 edge case).
#
# Cost note (NFR-12-07): once model-quality evals are wired, average run must stay ≤ $0.50.

name: AI Eval Gate

on:
  pull_request:
    branches: ["main"]
    paths:
      - "lib/ai/**"
      - "evals/**"
      - "lib/ai/prompts/**"

concurrency:
  group: eval-ai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # to post eval summary comment

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "11.1.3"

jobs:
  eval-gate:
    name: AI Eval Gate
    runs-on: ubuntu-latest
    # Skip on fork PRs — they don't have access to LLM secrets, which is intentional (§8 edge case).
    # The job reports a neutral 'skipped' status rather than failing, so it doesn't block forks.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository ||
      github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for AI gateway key
        id: key-check
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "present=false" >> $GITHUB_OUTPUT
            echo "::notice title=Eval Gate::AI_GATEWAY_API_KEY not set — eval suite skipped (fork PR or secret not configured)"
          else
            echo "present=true" >> $GITHUB_OUTPUT
          fi
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - name: Run eval gate
        if: steps.key-check.outputs.present == 'true'
        # pnpm eval:gate runs the Braintrust eval suite against per-feature thresholds:
        #   Spec 05 (search) — nDCG@5 >= 0.65
        #   Spec 06 (readers-advisor) — refusal_accuracy >= 0.90, cross_tenant_probe = 0 leaks
        #   Spec 07 (notifications) — template_render_success = 1.0
        #   Spec 08 (reporting) — sql_correctness >= 0.95
        #   Spec 11 (ai-governance) — cross_tenant_probe = 0 leaks (all features)
        # Exits non-zero if any threshold is missed; logs failing scenarios for quick repro.
        # NFR-12-07: suite is chunked across parallel evals; guard at 20 min wall-clock.
        run: pnpm eval:gate
        timeout-minutes: 20
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}

      - name: Post eval summary to PR
        if: always() && steps.key-check.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // pnpm eval:gate writes .eval-results/summary.json when it finishes.
            const summaryPath = '.eval-results/summary.json';
            let body = '### AI Eval Gate Results\n\n';
            if (fs.existsSync(summaryPath)) {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              body += '| Feature | Metric | Score | Threshold | Status |\n';
              body += '|---------|--------|-------|-----------|--------|\n';
              for (const row of summary.results ?? []) {
                const icon = row.passed ? '✅' : '❌';
                body += `| ${row.feature} | ${row.metric} | ${row.score} | ${row.threshold} | ${icon} |\n`;
              }
              if (summary.cost_usd !== undefined) {
                body += `\n**Eval cost:** $${summary.cost_usd.toFixed(4)} (budget: $0.50)\n`;
              }
            } else {
              body += '_Eval results file not found — check the job log._';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
