decisions_recent:
  - id: "D-2026-05-21-stack-pivot"
    decision: >
      Pivot from .NET 10 / EF / Vercel to Next.js 16 full-stack on Vercel + Neon Postgres + pgvector.
      Rationale: Vercel does not host .NET; we need a single deployable on Vercel for the demo URL.
    refs:
      - "docs/analysis/01-radar-analysis.md"
      - "docs/analysis/03-tech-stack-decisions.md"
  - id: "D-2026-05-21-solution-A-single-app"
    decision: >
      Adopt Solution A: single Next.js app, all state in Postgres (incl. pgvector embeddings), Auth0 Organizations
      as tenant boundary, four-layer isolation (auth → repo guard → SET LOCAL → RLS FORCE).
    refs:
      - "docs/analysis/01-radar-analysis.md §Recommendation"
      - "project_docs/specs/01-foundation-multi-tenancy-auth.spec.md"
  - id: "D-2026-05-21-ai-tier1"
    decision: >
      Lock AI Tier-1 feature set: hybrid catalog search, Reader's Advisor (RAG + tool calls), ISBN-to-record
      enrichment. Tier-2 ships if time allows; Tier-3 personalized recs is post-MVP.
    refs:
      - "docs/analysis/02-ai-features-research.md"
      - "project_docs/specs/05-search-discovery.spec.md"
      - "project_docs/specs/06-readers-advisor.spec.md"
      - "project_docs/specs/02-book-management.spec.md"
  - id: "D-2026-05-21-roles-and-signup"
    decision: >
      Role hierarchy: System Owner / Tenant Admin / Librarian / Member / Guest. Demo tenant pre-seeded with one
      account per role. Member self-signup is a public form per tenant; status='pending' → librarian approval
      queue → welcome email on approve / rejection email on reject.
    refs:
      - "project_docs/specs/04-member-management.spec.md"

